<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="#0b0910"/>

  <!-- Glow effect around the lens (green) -->
  <circle cx="50" cy="50" r="10.5" fill="#2fff8f" opacity="0.15" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="8" fill="#2fff8f" opacity="0.10" filter="url(#glow)"/>

  <!-- Left ring (violet) -->
  <circle cx="43.5" cy="50" r="13" fill="none" stroke="#8b5cf6" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right ring (violet) -->
  <circle cx="56.5" cy="50" r="13" fill="none" stroke="#8b5cf6" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Shared lens (green) with glow -->
  <defs>
    <mask id="lensMask">
      <circle cx="43.5" cy="50" r="13" fill="white"/>
      <circle cx="56.5" cy="50" r="13" fill="white"/>
    </mask>
  </defs>
  <ellipse cx="50" cy="50" rx="5.2" ry="13" fill="#2fff8f" mask="url(#lensMask)" filter="url(#glow)"/>
</svg>
