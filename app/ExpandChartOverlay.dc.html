<style>
  @keyframes expandOverlayFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes expandOverlayFadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }

  @keyframes expandContainerScale {
    from {
      transform: scale(0.95);
      opacity: 0;
    }
    to {
      transform: scale(1);
      opacity: 1;
    }
  }

  @keyframes expandContainerScaleOut {
    from {
      transform: scale(1);
      opacity: 1;
    }
    to {
      transform: scale(0.95);
      opacity: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #expand-chart-overlay,
    #expand-chart-container {
      animation: none !important;
    }
  }

  @media (max-width: 900px) {
    #expand-chart-container {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto;
    }

    #expand-houses-panel {
      grid-column: 1;
      grid-row: 3 / 4;
      max-height: 80px;
      display: none;
    }

    #expand-wheel-panel {
      grid-column: 1;
      grid-row: 1 / 2;
      border-right: none;
      border-bottom: 1px solid var(--bd);
    }

    #expand-table-panel {
      grid-column: 1;
      grid-row: 2 / 3;
      border-left: none;
      border-bottom: 1px solid var(--bd);
      max-height: 200px;
    }

    #expand-aspects-panel {

    }

    #expand-mobile-tabs {

    }

  }

  @media (max-width: 375px) {

      padding: 8px;
    }

    #expand-chart-container {
      width: 100%;
      height: 100%;
      border-radius: 8px;
    }

    #expand-chart-close {
      width: 32px;
      height: 32px;
      font-size: 18px;
      top: 8px;
      right: 8px;
    }
  }

  /* Table row styles */
  #expand-points-table-body tr {
    height: 22px;
    border-bottom: 1px solid var(--bd);
  }

  #expand-points-table-body tr:hover {

  #expand-points-table-body td {

    color: var(--dim);
  }

  /* Tooltip styles */

  }

  /* Details/summary styles */

  }

  }

  #expand-chart-overlay details > summary::before {

    opacity: 0.5;
    margin-right: 4px;
  }

  #expand-chart-overlay details[open] > summary::before {
    content: "▼ ";
  }

  /* Mobile tab active state */
  button[data-tab-button].active {
    color: var(--ac2-hi);
    border-bottom-color: var(--ac2-hi);
  }
</style>

<script>
/* ExpandChartOverlay interaction handlers */

// Initialize overlay state
if (!window.__expandChartState) {
  window.__expandChartState = {
    isOpen: false,
    focusedElement: null,
    originalOverflow: 'auto'
  };
}

/**
 * Open expanded chart overlay
 */
function openExpandedChart() {
  const overlay = document.getElementById('expand-chart-overlay');
  const container = document.getElementById('expand-chart-container');
  const app = window.__incommonApp;

  if (!overlay || !app) return;

  // Save current focus
  window.__expandChartState.focusedElement = document.activeElement;

  // Show overlay
  overlay.style.display = 'flex';
  window.__expandChartState.originalOverflow = document.body.style.overflow;
  document.body.style.overflow = 'hidden';

  // Load from localStorage
  const wasExpanded = localStorage.getItem('chart.expanded') === '1';
  if (!wasExpanded) localStorage.setItem('chart.expanded', '1');

  // Restore animation
  container.style.animation = 'none';
  void container.offsetWidth; // Trigger reflow
  container.style.animation = 'expandContainerScale 200ms ease-out forwards';

  // Set up focus trap
  overlay.addEventListener('keydown', handleExpandKeydown);
  overlay.focus();

  window.__expandChartState.isOpen = true;

  // Render expanded content
  if (app.expandedChartData) {
    renderExpandedChartContent();
  }
}

/**
 * Close expanded chart overlay
 */
function closeExpandedChart() {
  const overlay = document.getElementById('expand-chart-overlay');
  const container = document.getElementById('expand-chart-container');

  if (!overlay) return;

  // Fade out animation
  container.style.animation = 'expandContainerScaleOut 200ms ease-out forwards';
  overlay.style.animation = 'expandOverlayFadeOut 200ms ease-out forwards';

  setTimeout(() => {
    overlay.style.display = 'none';
    overlay.style.animation = 'expandOverlayFadeIn 200ms ease-out forwards';
    container.style.animation = 'expandContainerScale 200ms ease-out forwards';

    // Restore scroll
    document.body.style.overflow = window.__expandChartState.originalOverflow;

    // Update localStorage
    localStorage.setItem('chart.expanded', '0');

    // Restore focus
    const focusEl = window.__expandChartState.focusedElement;
    if (focusEl && document.contains(focusEl)) {
      focusEl.focus();
    } else {
      document.getElementById('expand-chart-button')?.focus();
    }

    // Clean up event listener
    overlay.removeEventListener('keydown', handleExpandKeydown);

    window.__expandChartState.isOpen = false;
  }, 200);
}

/**
 * Handle keyboard in overlay (Escape, Tab trap)
 */
function handleExpandKeydown(e) {
  if (e.key === 'Escape') {
    closeExpandedChart();
    e.preventDefault();
  }

  // Focus trap: Tab within overlay only
  if (e.key === 'Tab') {
    const overlay = document.getElementById('expand-chart-overlay');
    const focusableElements = overlay.querySelectorAll(
      'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
    );
    const firstEl = focusableElements[0];
    const lastEl = focusableElements[focusableElements.length - 1];

    if (e.shiftKey && document.activeElement === firstEl) {
      lastEl.focus();
      e.preventDefault();
    } else if (!e.shiftKey && document.activeElement === lastEl) {
      firstEl.focus();
      e.preventDefault();
    }
  }
}

/**
 * Switch mobile tab (points, aspects, houses)
 */
function switchExpandMobileTab(tabName) {
  const buttons = document.querySelectorAll('button[data-tab-button]');
  const container = document.getElementById('expand-mobile-tabs');
  const content = document.getElementById('expand-mobile-content');

  buttons.forEach(btn => {
    btn.classList.remove('active');
    if (btn.dataset.tabButton === tabName) {
      btn.classList.add('active');
    }
  });

  container.dataset.tab = tabName;

  // Populate content based on tab
  if (tabName === 'points') {
    content.innerHTML = '<p style="padding:8px;color:var(--dim)">Points table here</p>';
  } else if (tabName === 'aspects') {
    content.innerHTML = '<p style="padding:8px;color:var(--dim)">Aspects grid here</p>';
  } else if (tabName === 'houses') {
    content.innerHTML = '<p style="padding:8px;color:var(--dim)">House cusps here</p>';
  }
}

/**
 * Render expanded chart content (delegated to app methods)
 */
function renderExpandedChartContent() {
  const app = window.__incommonApp;
  if (!app) return;

  // Call app's expanded chart methods to populate the overlay
  // This is delegated to the Component methods from expandedChartMethods.js
  if (app.renderExpandedChartOverlay) {
    app.renderExpandedChartOverlay();
  }
}

// Restore expanded state from localStorage on page load
document.addEventListener('DOMContentLoaded', () => {
  if (localStorage.getItem('chart.expanded') === '1') {
    setTimeout(() => {
      openExpandedChart();
    }, 100);
  }
});

// Wire up handlers to global scope
window.__expandChart = {
  open: openExpandedChart,
  close: closeExpandedChart,
  switchTab: switchExpandMobileTab
};
</script>
