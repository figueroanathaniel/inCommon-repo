name: Calculator regressions
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/calculator-regressions.yml'
permissions:
  contents: read
jobs:
  sampled-reference-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare calculator with stored astronomical references
        run: node tools/check-calculator-regressions.js --json reports/calculator-regression-results.json
      - name: Preserve all check outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-regression-results
          path: reports/calculator-regression-results.json
          if-no-files-found: error
