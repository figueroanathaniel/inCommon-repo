# The repo root is not the site.
#
# There is no index.html at this level and there is not meant to be: deploy/
# holds one folder per shipped build, and the site is one of those folders.
# Point a host at the repo without this file and it serves a directory that has
# no page in it, which is a working deploy of nothing and reads as a broken
# link.
#
# There is no build step. The bundle in that folder is already built, by
# tools/build-bundle.js, run here rather than at the host.
#
# How the site is served is NOT restated here. The two rules that matter, every
# path resolving to the app and must-revalidate on the three files a redeploy
# has to reach, live beside the bundle in deploy/v6.2/_redirects and
# deploy/v6.2/_headers, so a folder dragged onto app.netlify.com/drop is served
# exactly like a deploy from the repo. Two files declaring the same rule is two
# files that can disagree.
#
# Bump publish when a new bundle folder is cut. It and BUNDLE in
# tools/build-bundle.js name the same folder and must agree.

[build]
  publish = "deploy/v6.2"
  command = ""
